name: Dune Review Trigger
on:
  pull_request:
    types: [opened, reopened]
permissions:
  pull-requests: write
  contents: read
  issues: write
jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Add dune-review-requested label
        run: |
          gh label create 'dune-review-requested' --color '0075ca' --description 'Dune AI review requested' --repo ${{ github.repository }} --force
          gh label create 'dune-review-in-progress' --color 'e4e669' --description 'Dune AI review in progress' --repo ${{ github.repository }} --force
          gh pr edit ${{ github.event.pull_request.number }} --add-label 'dune-review-requested' --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
